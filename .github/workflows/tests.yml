name: Python tests
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - name: Lint Phase 4 and modified Python files
        run: >-
          ruff check app.py pages src/conrod/ui
          scripts/phase4_finalize_evidence.py scripts/phase4_ml_evaluation.py
          scripts/phase4_refine_candidates.py scripts/phase4_fea_screen.py
          scripts/phase4_figures.py scripts/run_job.py scripts/package_phase4_evidence.py
          scripts/package_phase4_source.py scripts/split_phase4_final_evidence.py
          scripts/phase4_release_manifest.py src/conrod/phase4.py
          src/conrod/design_exploration.py src/conrod/design_families/__init__.py
          tests/test_phase4.py tests/test_phase4_ui_data.py tests/test_ui.py
      - name: Check formatting for Phase 4 and modified Python files
        run: >-
          ruff format --check app.py pages src/conrod/ui
          scripts/phase4_finalize_evidence.py scripts/phase4_ml_evaluation.py
          scripts/phase4_refine_candidates.py scripts/phase4_fea_screen.py
          scripts/phase4_figures.py scripts/run_job.py scripts/package_phase4_evidence.py
          scripts/package_phase4_source.py scripts/split_phase4_final_evidence.py
          scripts/phase4_release_manifest.py src/conrod/phase4.py
          src/conrod/design_exploration.py src/conrod/design_families/__init__.py
          tests/test_phase4.py tests/test_phase4_ui_data.py tests/test_ui.py
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .[test]
      - run: python -m compileall -q src scripts workers app.py
      - run: pytest -m "not integration" -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: test-results.xml
