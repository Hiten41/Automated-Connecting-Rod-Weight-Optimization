[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "validated-conrod"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.11", "scikit-learn>=1.3", "streamlit>=1.50", "plotly>=5.18", "joblib>=1.3", "trimesh>=4", "gmsh>=4.12", "matplotlib>=3.8"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: requires real FreeCAD, Gmsh and CalculiX"]
